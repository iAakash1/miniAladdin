[pytest]
# NumPy 2.2 on Apple Accelerate raises spurious divide/overflow/invalid flags
# from its vectorised matmul kernel — reproducible on two arrays of plain
# standard normals, where no such condition exists. The flags surface through
# scikit-learn's linear algebra and are not a property of this code.
#
# They are filtered HERE, narrowly, rather than in the source: our own matmul
# call sites suppress them and replace them with an explicit finiteness check
# (see src/quant/backtest/attribution.py), which is the stronger guarantee.
# Filtering by message keeps any genuine RuntimeWarning visible.
filterwarnings =
    ignore:divide by zero encountered in matmul:RuntimeWarning
    ignore:overflow encountered in matmul:RuntimeWarning
    ignore:invalid value encountered in matmul:RuntimeWarning
